# Render Blueprint — deploys the whole Masoom ERP (Postgres + API + Web) on the free tier.
# In Render: New → Blueprint → connect this repo. Render reads this file and creates everything.
# Free web services sleep after ~15 min idle (first request after is slow ~30-50s). That's fine for a demo.

databases:
  - name: masoom-db
    plan: free
    databaseName: masoom
    user: masoom

services:
  # ── Backend API (Express + Prisma + Puppeteer/Chromium for PDFs) ──
  - type: web
    name: masoom-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: masoom-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@masoom.ae
      - key: SEED_ADMIN_PASSWORD
        value: Admin@12345

  # ── Frontend (Next.js) — proxies /api/* to the backend, so no CORS/cookie issues ──
  - type: web
    name: masoom-web
    runtime: docker
    plan: free
    dockerfilePath: ./docker/frontend.Dockerfile
    dockerContext: .
    envVars:
      # Resolves to the API service's real .onrender.com host (next.config adds https://).
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: masoom-api
          type: web
          property: host
