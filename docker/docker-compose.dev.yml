services:
  postgres:
    image: postgres:16-alpine
    container_name: masoom-postgres
    environment:
      POSTGRES_USER: masoom
      POSTGRES_PASSWORD: masoom
      POSTGRES_DB: masoom
    ports:
      - "5432:5432"
    volumes:
      - masoom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masoom -d masoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: masoom-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  masoom-pgdata:
