upstream masoom_api { server api:4000; keepalive 32; }
upstream masoom_web { server web:3000; keepalive 32; }

# In production, terminate TLS on 443 and redirect 80 → 443.
# Replace `your-domain.ae` with the actual domain.

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass         http://masoom_api;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID      $request_id;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass         http://masoom_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
  }
}
